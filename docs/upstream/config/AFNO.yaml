### base config ###
full_field: &FULL_FIELD
  loss: 'l2'
  lr: 1E-3
  scheduler: 'CosineAnnealingLR'  # 'CosineAnnealingLR' or 'ReduceLROnPlateau'
  num_workers: 16
  device: 'gpu'
  dt: 1 # how many timesteps ahead the model will predict
  n_history: 0 # how many previous timesteps to consider
  prediction_type: 'iterative'
  n_prediction: 1 # applicable only if prediction_type == 'iterative'
  # n_initial_conditions: 5 # applicable only if prediction_type == 'iterative'
  ics_type: "default"
  save_raw_forecasts: !!bool True
  save_channel: !!bool False
  #  masked_acc: !!bool False
  #  maskpath: None
  perturb: !!bool False
  add_grid: !!bool False
  n_grid_channels: 0
  gridtype: 'sinusoidal' #options 'sinusoidal' or 'linear'
  n_lon_periodic: 0
  max_epochs: 50
  batch_size: 1
  weight_channel: !!bool False
  # afno hyperparams
  model_name: 'afnonet'
  num_blocks: 8
  patch_size: 4
  depth: 12
  embed_dim: 768
  mlp_ratio: 4
  drop_rate: 0
  # prediction flow field
  flow: !!bool True
  normalization: 'zscore' #options zscore (minmax not supported)
  enable_nhwc: !!bool True
  optimizer_type: 'AdamW'  # Adam, AdamW, or FusedAdam
  #  crop_size_x: None
  #  crop_size_y: None
  geomagnetic: !!bool True
  solar: !!bool True
  log_to_screen: !!bool True
  # log_to_wandb: !!bool False
  save_checkpoint: !!bool True
  two_step_training: !!bool False
  # plot_animations: !!bool False
  add_noise: !!bool False
  noise_std: 0
  static_data_path:  'D:\tiegcm2.0_res5.0\static'

