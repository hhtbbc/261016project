afno_inference:
  <<: *FULL_FIELD
  device: 'gpu'
  num_workers: 4
  model_name: 'afnonet'
  num_blocks: 8
  patch_size: 4
  dt: 1
  depth: 12
  embed_dim: 768
  mlp_ratio: 4
  drop_rate: 0.0
  lr: 5E-4
  batch_size: 16
  n_lon_periodic: 0
  #Set to False for direct forecasting, and to True for increment-based forecasting.
  flow: !!bool True
  perturb: !!bool False
  n_perturbations: 24
  two_step_training: !!bool False
  # initialising net by ckpt file
  resuming: !!bool False
  step_con: !!bool False
  #Year-round forecast
#  year_pre: !!bool False
  #Forecast days
  pre_day: 1
  # weight by chennels
  weight_channel: !!bool True
  #  ['TN', 'UN', 'VN', 'WN', 'Z', 'DEN', 'NE', 'ZG', 'TLBC', 'ULBC', 'VLBC', 'f107d', 'f107a', 'Kp']
  in_variables:  ['TN', 'UN', 'VN', 'WN', 'Z', 'DEN', 'TLBC', 'ULBC', 'VLBC']
  in_drivers: ['f107d', 'f107a', 'Kp']
  out_variables:  ['TN', 'UN', 'VN', 'WN', 'Z', 'DEN']
  exp_dir: 'output'
  prediction_type: 'iterative'
  n_prediction: 24 # (hr) applicable only if prediction_type == 'iterative'预测24步长
  test_data_path: 'D:\tiegcm2.0_res5.0\test'
  #Load the trained model checkpoint and restore the model weights.
  best_checkpoint_path : 'D:\FourCast_TGCM\output\fourcastnet\flow\training_checkpoints\ckpt.tar'
  pre_resultname: 'flow'
  date_time: '2023-3-21 00:00:00'
  result_save: !!bool True
#  plt_comparison: !!bool True
  mean_pre_var : 'DEN'
  n_history: 0
  res_file: !!bool false
  log_DEN: !!bool False
#If DEN is to be log-transformed, please use the following static variable address file.
# static_data_path:  "..\static_log"