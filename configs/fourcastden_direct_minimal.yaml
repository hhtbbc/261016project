  device: gpu
  num_workers: 0
  model_name: afnonet
  num_blocks: 8
  patch_size: 4
  dt: 1
  depth: 12
  embed_dim: 768
  mlp_ratio: 4
  drop_rate: 0.0
  lr: 5E-4
  batch_size: 16
  n_lon_periodic: 0
  #Set to False for direct forecasting, and to True for increment-based forecasting.
  flow: false
  perturb: false
  n_perturbations: 24
  two_step_training: false
  # initialising net by ckpt file
  resuming: false
  step_con: false
  #Year-round forecast
#  year_pre: !!bool False
  #Forecast days
  pre_day: 1
  # weight by chennels
  weight_channel: true
  #  ['TN', 'UN', 'VN', 'WN', 'Z', 'DEN', 'NE', 'ZG', 'TLBC', 'ULBC', 'VLBC', 'f107d', 'f107a', 'Kp']
  in_variables: [TN, UN, VN, WN, Z, DEN, TLBC, ULBC, VLBC]
  in_drivers: [f107d, f107a, Kp]
  out_variables: [TN, UN, VN, WN, Z, DEN]
  exp_dir: output
  prediction_type: iterative
  n_prediction: 1  # (hr) applicable only if prediction_type == 'iterative'预测24步长
  test_data_path: /workspace/data/20261016/data/raw/test_minimal_2023
  #Load the trained model checkpoint and restore the model weights.
  best_checkpoint_path: /workspace/data/20261016/models/checkpoints/author/Direct_ckpt.tar
  pre_resultname: direct_one_hour
  date_time: '2023-3-21 00:00:00'
  result_save: true
#  plt_comparison: !!bool True
  mean_pre_var: DEN
  n_history: 0
  res_file: false
  log_DEN: false
#If DEN is to be log-transformed, please use the following static variable address file.
# static_data_path:  "..\static_log"
  ics_type: default
  static_data_path: /workspace/data/20261016/data/processed/static
  img_shape_x: 36
  img_shape_y: 72
